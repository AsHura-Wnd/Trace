openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Trace - AI-powered collaborative memory API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: Project operations
  - name: memories
    description: Memory entry operations
  - name: tasks
    description: Task operations
  - name: ai
    description: AI-powered operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project by ID
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/stats:
    get:
      operationId: getProjectStats
      tags: [projects]
      summary: Get project stats and summary counts
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectStats"

  /projects/{projectId}/activity:
    get:
      operationId: getProjectActivity
      tags: [projects]
      summary: Get recent activity feed for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memory"

  /projects/{projectId}/search:
    get:
      operationId: searchProjectMemories
      tags: [projects]
      summary: Full-text search memories in a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memory"

  /projects/{projectId}/ask:
    post:
      operationId: askProjectQuestion
      tags: [ai]
      summary: Ask the AI a question about the project's memory
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionInput"
      responses:
        "200":
          description: AI answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnswer"

  /projects/{projectId}/insights:
    get:
      operationId: getProjectInsights
      tags: [ai]
      summary: Get AI-generated insights and action items for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectInsights"

  /projects/{projectId}/memories:
    get:
      operationId: listMemories
      tags: [memories]
      summary: List memories for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [discussion, decision, task, link, note, screenshot]
      responses:
        "200":
          description: List of memories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Memory"
    post:
      operationId: createMemory
      tags: [memories]
      summary: Create a new memory entry
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"

  /projects/{projectId}/memories/{memoryId}:
    get:
      operationId: getMemory
      tags: [memories]
      summary: Get a memory entry
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: memoryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Memory found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
        "404":
          description: Not found
    patch:
      operationId: updateMemory
      tags: [memories]
      summary: Update a memory entry
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: memoryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"
    delete:
      operationId: deleteMemory
      tags: [memories]
      summary: Delete a memory entry
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: memoryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/memories/{memoryId}/summarize:
    post:
      operationId: summarizeMemory
      tags: [ai]
      summary: AI-summarize a memory entry
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: memoryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Summary generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Memory"

  /projects/{projectId}/tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List tasks for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, in_progress, done]
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"

  /projects/{projectId}/tasks/{taskId}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /projects/{projectId}/extract-tasks:
    post:
      operationId: extractTasksFromMemory
      tags: [ai]
      summary: AI-extract tasks from a memory entry
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtractTasksInput"
      responses:
        "200":
          description: Extracted tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Project:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        teamName:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: ["string", "null"]
          format: date-time

    ProjectInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        teamName:
          type: string

    ProjectUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        teamName:
          type: string

    ProjectStats:
      type: object
      required: [totalMemories, totalTasks, openTasks, memoriesByType]
      properties:
        totalMemories:
          type: integer
        totalTasks:
          type: integer
        openTasks:
          type: integer
        memoriesByType:
          type: object
          additionalProperties:
            type: integer
        recentDecisions:
          type: integer
        completedTasks:
          type: integer

    Memory:
      type: object
      required: [id, projectId, type, content, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        type:
          type: string
          enum: [discussion, decision, task, link, note, screenshot]
        content:
          type: string
        summary:
          type: ["string", "null"]
        source:
          type: ["string", "null"]
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: ["string", "null"]
          format: date-time

    MemoryInput:
      type: object
      required: [type, content]
      properties:
        type:
          type: string
          enum: [discussion, decision, task, link, note, screenshot]
        content:
          type: string
          minLength: 1
        source:
          type: string
        tags:
          type: array
          items:
            type: string

    MemoryUpdate:
      type: object
      properties:
        content:
          type: string
        summary:
          type: string
        source:
          type: string
        tags:
          type: array
          items:
            type: string

    Task:
      type: object
      required: [id, projectId, title, status, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        memoryId:
          type: ["integer", "null"]
        title:
          type: string
        assignee:
          type: ["string", "null"]
        status:
          type: string
          enum: [open, in_progress, done]
        dueDate:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    TaskInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
        assignee:
          type: string
        status:
          type: string
          enum: [open, in_progress, done]
        dueDate:
          type: string
          format: date-time
        memoryId:
          type: integer

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
        assignee:
          type: string
        status:
          type: string
          enum: [open, in_progress, done]
        dueDate:
          type: string
          format: date-time

    QuestionInput:
      type: object
      required: [question]
      properties:
        question:
          type: string
          minLength: 1

    AiAnswer:
      type: object
      required: [answer]
      properties:
        answer:
          type: string
        relevantMemories:
          type: array
          items:
            type: integer

    ProjectInsights:
      type: object
      required: [summary, keyDecisions, actionItems, risks]
      properties:
        summary:
          type: string
        keyDecisions:
          type: array
          items:
            type: string
        actionItems:
          type: array
          items:
            type: string
        risks:
          type: array
          items:
            type: string

    ExtractTasksInput:
      type: object
      required: [memoryId]
      properties:
        memoryId:
          type: integer
